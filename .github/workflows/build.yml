name: Build BE12 Pro 25.12

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build.yml
      - extra.config

permissions:
  contents: read

concurrency:
  group: be12-pro-build
  cancel-in-progress: false

env:
  SOURCE_BRANCH: 25.12-dev-wifi7

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable Linux runner
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-dev python3-pyelftools rsync swig unzip zlib1g-dev file wget curl ccache xsltproc patch time help2man libelf-dev zstd
          df -h
      - name: Fetch upstream branch and feeds
        run: |
          git init openwrt
          cd openwrt
          git remote add origin https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
          git fetch --depth=1 origin "$SOURCE_BRANCH"
          git checkout --detach FETCH_HEAD
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cat > feeds.conf <<'EOF'
          src-git packages https://github.com/immortalwrt/packages.git^2dba1dd2af3b447faf52f85c0850a6f9667cac17
          src-git luci https://github.com/immortalwrt/luci.git^c84adb975e207ae8b14982191838ec6218d632cd
          src-git routing https://github.com/openwrt/routing.git^48c808034414a2112cf9d5261a20a320e8d0d170
          src-git istore https://github.com/istoreos/istore.git^a97ace34f2da358a015b094d326bba2697697f2e
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # The pinned LuCI feed's unused WeeChat app has a recursive dependency.
          rm -f package/feeds/luci/luci-app-weechat
          {
            git rev-parse HEAD
            for feed in packages luci routing istore; do
              printf '%s ' "$feed"
              git -C "feeds/$feed" rev-parse HEAD
            done
          } > build-revisions.txt
      - name: Configure BE12 Pro with upstream Wi-Fi 7 preset
        run: |
          cd openwrt
          cp defconfig/low-mem-512m/mt7987-mt7992-be7200.config .config
          cat ../extra.config >> .config
          # GNU tar's virtual xz dependency needs an explicit provider in this feed.
          echo CONFIG_PACKAGE_xz-utils=y >> .config
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_routerich_be7200=/d' .config
          make defconfig
          python3 - <<'PY'
          from pathlib import Path
          config = Path('.config').read_text().splitlines()
          expected = ['TARGET_DEVICE_mediatek_filogic_DEVICE_tenda_be12-pro', 'PACKAGE_kmod-mt7992', 'PACKAGE_kmod-mt_wifi7', 'PACKAGE_mtwifi-cfg-ucode', 'PACKAGE_luci', 'PACKAGE_ppp-mod-pppoe', 'PACKAGE_tailscale', 'PACKAGE_dnsmasq-full', 'PACKAGE_luci-app-store']
          missing = [name for name in expected if f'CONFIG_{name}=y' not in config]
          if missing:
              raise SystemExit('Required build components absent: ' + ', '.join(missing))
          PY
          ./scripts/diffconfig.sh > build.diffconfig
      - name: Download build sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
      - name: Compile firmware
        run: |
          cd openwrt
          make -j"$(nproc)" V=s 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
      - name: Validate and collect firmware
        run: |
          mkdir -p output
          cp openwrt/build-revisions.txt openwrt/build.diffconfig openwrt/.config output/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, tarfile
          root = Path('openwrt/bin/targets/mediatek/filogic')
          images = list(root.glob('*tenda_be12-pro*squashfs-sysupgrade.bin'))
          assert len(images) == 1, images
          image = images[0]
          with tarfile.open(image) as archive:
              names = archive.getnames()
              kernel = next(n for n in names if n.endswith('/kernel'))
              content = archive.extractfile(kernel).read()
              assert content[:4] == b'God1', 'Missing Tenda stock bootloader header'
              assert len(content) <= 0x600000, 'Kernel exceeds BE12 Pro partition'
          for path in root.iterdir():
              if path.is_file() and ('tenda_be12-pro' in path.name or path.name in ['profiles.json','sha256sums','config.buildinfo','feeds.buildinfo','version.buildinfo']):
                  shutil.copy2(path, 'output')
          output = Path('output')
          hashes = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in sorted(output.iterdir()) if p.is_file()]
          (output/'LOCAL_SHA256SUMS').write_text('\n'.join(hashes)+'\n')
          (output/'validation.json').write_text(json.dumps({'device':'tenda,be12-pro','image':image.name,'kernel_bytes':len(content),'kernel_partition_bytes':0x600000,'source_commit':os.environ['SOURCE_COMMIT']},indent=2))
          PY
      - name: Upload firmware and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: be12-pro-25.12-firmware
          path: output/
          retention-days: 14
          include-hidden-files: true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            openwrt/build.log
            openwrt/build.diffconfig
            openwrt/build-revisions.txt
            openwrt/.config
            openwrt/tmp/.config-package.in
            openwrt/logs/
          retention-days: 7
          include-hidden-files: true
